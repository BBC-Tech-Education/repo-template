; Main controller firmware
; Docs: https://docs.platformio.org/page/projectconf.html
;
; Teensy 4.1 teams: use this file as it is.
; Mega 2560 teams: delete the [env:teensy41] section, remove the ; at the start of
; each line of the [env:megaatmega2560] section, and rename this folder to Mega-Main
; (see Software/README.md).

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200

; [env:megaatmega2560]
; platform = atmelavr
; board = megaatmega2560
; framework = arduino
; monitor_speed = 115200

; Add the libraries your code needs under lib_deps, with the exact version, e.g.
; lib_deps =
;     adafruit/Adafruit BNO055 @ 1.6.4
